<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moonlit Echoes - Relaxing Sounds App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0f1a 0%, #1a1f3a 100%);
            min-height: 100vh;
            color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            text-align: center;
        }

        .logo {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        .tagline {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }

        .features {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .feature {
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .store-badge {
            display: inline-block;
            padding: 1rem 2rem;
            background: linear-gradient(90deg, #7c3aed, #3b82f6);
            border-radius: 12px;
            color: white;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 2rem;
        }

        .links {
            margin-top: 2rem;
        }

        .links a {
            color: #60a5fa;
            text-decoration: none;
            margin: 0 1rem;
        }

        .links a:hover {
            text-decoration: underline;
        }

        footer {
            margin-top: 3rem;
            color: #64748b;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">🌙</div>
        <h1>Moonlit Echoes</h1>
        <p class="tagline">Relaxing sounds for peaceful sleep and focus</p>

        <div class="features">
            <div class="feature">🎵 40+ Sounds</div>
            <div class="feature">🌿 Nature</div>
            <div class="feature">😴 Sleep Timer</div>
            <div class="feature">❤️ Favorites</div>
        </div>

        <a href="https://play.google.com/store/apps/details?id=com.relaxingvoices.app" class="store-badge">
            📱 Download on Google Play
        </a>

        <div class="links">
            <a href="https://sites.google.com/view/moonlit-echoes-pp/ana-sayfa">Privacy Policy</a>
        </div>

        <footer>
            © 2025 Moonlit Echoes. All rights reserved.
        </footer>
    </div>
</body>

</html>
