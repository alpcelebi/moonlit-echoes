<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Moonlit Echoes: Sleep Sounds. App Store ve Google Play indirme bağlantısı.">
  <meta name="theme-color" content="#0b1022">
  <meta property="og:title" content="Moonlit Echoes — Sleep Sounds &amp; White Noise">
  <meta property="og:description" content="App Store (iOS) ve Google Play (Android) üzerinden hemen indirin.">
  <meta property="og:image" content="https://alpcelebi.github.io/moonlit-echoes/icon.png">
  <meta property="og:url" content="https://alpcelebi.github.io/moonlit-echoes/download.html">
  <link rel="icon" href="icon.png">
  <title>Moonlit Echoes - App Store &amp; Google Play</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      background: radial-gradient(circle at 50% 18%, #1e1b4b 0%, #0b0f24 60%, #050814 100%);
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(100% - 40px, 480px);
      margin: 0 auto;
      padding: 64px 0 32px;
      text-align: center;
    }
    .icon {
      width: 112px;
      height: 112px;
      object-fit: cover;
      border-radius: 26px;
      border: 2px solid rgba(167, 139, 250, 0.5);
      box-shadow: 0 16px 45px rgba(139, 92, 246, 0.45);
    }
    h1 {
      font-size: 32px;
      line-height: 1.2;
      margin: 24px 0 8px;
      overflow-wrap: anywhere;
    }
    .subtitle {
      color: #c4b5fd;
      margin: 0 0 32px;
      font-size: 17px;
    }
    .stores {
      display: grid;
      gap: 14px;
    }
    .store {
      display: flex;
      min-height: 74px;
      align-items: center;
      justify-content: space-between;
      padding: 16px 22px;
      border-radius: 14px;
      background: rgba(30, 27, 75, 0.85);
      border: 1.5px solid rgba(167, 139, 250, 0.45);
      color: #fff;
      text-decoration: none;
      text-align: left;
      gap: 12px;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .store.google {
      background: rgba(6, 78, 59, 0.85);
      border-color: rgba(52, 211, 153, 0.45);
    }
    .store strong { display: block; font-size: 21px; }
    .store small { display: block; margin-top: 4px; font-size: 14px; color: #cbd5e1; }
    .store span { font-size: 28px; flex-shrink: 0; }
    a:focus-visible { outline: 3px solid #a78bfa; outline-offset: 4px; }
    .store:hover { opacity: 0.92; transform: translateY(-1px); }
    footer {
      margin-top: 36px;
      font-size: 14px;
      color: #94a3b8;
    }
    footer a { color: #cbd5e1; text-underline-offset: 4px; }
    @media (max-height: 600px) {
      main { padding-top: 24px; }
      .icon { width: 84px; height: 84px; }
    }
  </style>
</head>
<body>
  <main>
    <img class="icon" src="icon.png" width="112" height="112" alt="Moonlit Echoes">
    <h1>Moonlit Echoes</h1>
    <p class="subtitle">Sleep Sounds &amp; White Noise</p>
    <nav class="stores" aria-label="Uygulama mağazaları">
      <a class="store" id="apple" href="https://apps.apple.com/tr/app/moonlit-echoes-sleep-sounds/id6769229121?l=tr">
        <div><strong>App Store</strong><small>iPhone &bull; %100 Reklamsız</small></div><span aria-hidden="true">&rarr;</span>
      </a>
      <a class="store google" id="google" href="https://play.google.com/store/apps/details?id=com.relaxingvoices.app">
        <div><strong>Google Play</strong><small>Android &bull; Ücretsiz İndir</small></div><span aria-hidden="true">&rarr;</span>
      </a>
    </nav>
    <footer><a href="https://alpcelebi.github.io/privacy-ios.html">Gizlilik politikası</a> &middot; <a href="https://alperencodes.com">@alperen.codes</a></footer>
  </main>
  <script>
    function storeForDevice(userAgent, platform, touchPoints) {
      if (/android/i.test(userAgent)) return 'google';
      if (/iPhone|iPad|iPod/i.test(userAgent) ||
          (platform === 'MacIntel' && touchPoints > 1)) return 'apple';
      return null;
    }
    var store = storeForDevice(navigator.userAgent, navigator.platform, navigator.maxTouchPoints || 0);
    if (store && new URLSearchParams(location.search).get('choose') !== '1') {
      location.replace(document.getElementById(store).href);
    }
  </script>
</body>
</html>
